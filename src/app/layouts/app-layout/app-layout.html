<div class="min-h-screen bg-light-bg dark:bg-dark-bg transition-colors duration-300">
  <!-- Top Header -->
  <app-navbar />

  <!-- Main Content -->
  <main class="pb-20 md:pb-0">
    <div class="max-w-6xl mx-auto px-4 sm:px-5 lg:px-8 py-4 sm:py-6">
      <router-outlet />
    </div>
  </main>

  <!-- Bottom Navigation (mobile only) -->
  <nav
    class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/95 dark:bg-dark-surface/95 backdrop-blur-xl border-t border-light-border dark:border-dark-border shadow-bottom-nav dark:shadow-bottom-nav-dark"
    style="padding-bottom: env(safe-area-inset-bottom)">
    <div class="flex items-center justify-around h-16 px-2">
      <a routerLink="/ingressos" routerLinkActive="active-tab" [routerLinkActiveOptions]="{exact: false}"
        class="bottom-tab" (click)="onTabClick()">
        <i class="pi pi-ticket text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Eventos</span>
      </a>

      <a routerLink="/produtos" routerLinkActive="active-tab" [routerLinkActiveOptions]="{exact: false}"
        class="bottom-tab" (click)="onTabClick()">
        <i class="pi pi-shop text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Loja</span>
      </a>

      <a routerLink="/carrinho" routerLinkActive="active-tab" [routerLinkActiveOptions]="{exact: false}"
        class="bottom-tab" (click)="onTabClick()">
        <div class="relative">
          <i class="pi pi-shopping-cart text-xl"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5">Carrinho</span>
      </a>

      <button (click)="toggleTheme()" class="bottom-tab">
        @if (themeService.isDarkMode()) {
        <i class="pi pi-sun text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Claro</span>
        } @else {
        <i class="pi pi-moon text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Escuro</span>
        }
      </button>

      @if (isLoggedIn()) {
      <button (click)="logout()" class="bottom-tab">
        <i class="pi pi-user text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Perfil</span>
      </button>
      } @else {
      <a routerLink="/auth/login" class="bottom-tab" (click)="onTabClick()">
        <i class="pi pi-sign-in text-xl"></i>
        <span class="text-[10px] font-semibold mt-0.5">Entrar</span>
      </a>
      }
    </div>
  </nav>
</div>
